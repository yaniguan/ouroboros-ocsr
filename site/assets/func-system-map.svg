<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#0d9488"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1280" height="660" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="44" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0d9488">MODULAR FUNCTION ARCHITECTURE · ouroboros.* + lab.* + scripts/*</text>
  <text x="40" y="72" font-size="22" font-weight="700" fill="#0f172a">Every Ouroboros function from 2D pixels to 3D forces and lab agents</text>

  <!-- COLUMN 1: INPUTS -->
  <g transform="translate(40, 108)">
    <rect width="230" height="148" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="76" height="22" rx="6" fill="#f0fdfa"/>
    <text x="54" y="31" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">INPUT 01</text>
    <text x="16" y="60" font-size="16" font-weight="700" fill="#0f172a">Molecule Drawings</text>
    <text x="16" y="84" font-size="12.5" fill="#475569">• Papers &amp; patents (ACS, USPTO)</text>
    <text x="16" y="105" font-size="12.5" fill="#475569">• Rotated scans &amp; sketches</text>
    <text x="16" y="126" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0d9488">ingest_real.py --ink-crop</text>
  </g>

  <g transform="translate(40, 286)">
    <rect width="230" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="76" height="22" rx="6" fill="#eff6ff"/>
    <text x="54" y="31" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">INPUT 02</text>
    <text x="16" y="60" font-size="16" font-weight="700" fill="#0f172a">Unlabeled Batches</text>
    <text x="16" y="84" font-size="12.5" fill="#475569">• Protocol figures &amp; SI crops</text>
    <text x="16" y="105" font-size="12.5" fill="#475569">• Shared-GPU RL rollouts</text>
    <text x="16" y="124" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2563eb">predict_real.py --unlabeled</text>
  </g>

  <g transform="translate(40, 456)">
    <rect width="230" height="164" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="16" y="16" width="76" height="22" rx="6" fill="#eef2ff"/>
    <text x="54" y="31" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">INPUT 03</text>
    <text x="16" y="60" font-size="16" font-weight="700" fill="#0f172a">96-Well Plate Top Views</text>
    <text x="16" y="84" font-size="12.5" fill="#475569">• 8×12 rectangular plates</text>
    <text x="16" y="105" font-size="12.5" fill="#475569">• 6/12/18/24/36 circular rings</text>
    <text x="16" y="126" font-size="12.5" fill="#475569">• Any camera rotation 0°–360°</text>
    <text x="16" y="147" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#4f46e5">ouroboros.labvision</text>
  </g>

  <!-- COLUMN 2: VISION & DECODING ENGINES -->
  <g transform="translate(336, 108)">
    <rect width="340" height="318" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect x="20" y="18" width="136" height="24" rx="6" fill="#ccfbf1"/>
    <text x="88" y="34" font-size="11" font-weight="700" fill="#0f766e" text-anchor="middle">2D OCSR ENGINE</text>
    <text x="20" y="66" font-size="18" font-weight="700" fill="#0f172a">Equivariant Vision &amp; Decoding</text>

    <rect x="20" y="84" width="300" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="34" y="106" font-size="13.5" font-weight="700" fill="#0f172a">1. C8 Steerable / CNN Encoders</text>
    <text x="34" y="126" font-size="12" fill="#475569">Arm C (32.4M, 8-angle cyclic shift, exportable)</text>
    <text x="34" y="141" font-size="12" fill="#475569">Arm A (43.2M plain CNN) · Arm B (360° aug)</text>

    <rect x="20" y="158" width="300" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="34" y="180" font-size="13.5" font-weight="700" fill="#0f172a">2. Teacher Ensemble &amp; Reranking</text>
    <text x="34" y="200" font-size="12" fill="#475569">Beam 5 + RDKit validity rerank + pad/sharpen TTA</text>
    <text x="34" y="215" font-size="12" fill="#0d9488">46.7% frozen-test-v2 · 85.0% UOB · 54.0% dev-test</text>

    <rect x="20" y="232" width="300" height="68" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="34" y="254" font-size="13.5" font-weight="700" fill="#0f766e">3. Sub-Second CPU API &amp; Quantizer</text>
    <text x="34" y="273" font-size="12" fill="#334155">int8 dynamic decoder: 229 ms p50 · FastAPI /predict</text>
    <text x="34" y="290" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0f766e">ouroboros.infer · lab.quantize</text>
  </g>

  <g transform="translate(336, 456)">
    <rect width="340" height="164" rx="16" fill="#ffffff" stroke="#6366f1" stroke-width="1.8"/>
    <rect x="20" y="16" width="142" height="24" rx="6" fill="#e0e7ff"/>
    <text x="91" y="32" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">PLATE GEOMETRY</text>
    <text x="20" y="62" font-size="17" font-weight="700" fill="#0f172a">Symmetry-Aware Well Finder</text>
    <text x="20" y="86" font-size="12.5" fill="#475569">• Rect: 4-corner homography + A1 chamfer/dot</text>
    <text x="20" y="106" font-size="12.5" fill="#475569">• Circ: SO(2) Fourier phase + rim notch + mirror dot</text>
    <text x="20" y="126" font-size="12.5" fill="#475569">• ROW_MAJOR / COL_MAJOR / RING_MAJOR + ambiguous flag</text>
    <text x="20" y="147" font-size="12" font-weight="600" fill="#4338ca">2.6 ms rect · 9.0 ms circ · 99.2–100% unflagged</text>
  </g>

  <!-- COLUMN 3: DOWNSTREAM VERIFICATION, 3D PHYSICS & LAB AGENT -->
  <g transform="translate(744, 108)">
    <rect width="496" height="156" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="20" y="16" width="164" height="24" rx="6" fill="#dbeafe"/>
    <text x="102" y="32" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">LAB AGENT &amp; RL HOOKS</text>
    <text x="20" y="62" font-size="17" font-weight="700" fill="#0f172a">Confidence Gate, Context JSONL &amp; Verifier</text>
    <text x="20" y="86" font-size="12.5" fill="#475569">• Score-margin &amp; disagreement gate (ouroboros.decode.confidence)</text>
    <text x="20" y="106" font-size="12.5" fill="#475569">• Frozen ouroboros.molecule_context/v1: ok → SMILES, review → ask human</text>
    <text x="20" y="126" font-size="12.5" fill="#475569">• Batched GRPO reward verifier + edge distillation plan (lab.*)</text>
    <text x="20" y="145" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1d4ed8">eval_selective.py · lab.molecule_context · lab.edge_plan</text>
  </g>

  <g transform="translate(744, 286)">
    <rect width="496" height="168" rx="16" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
    <rect x="20" y="16" width="176" height="24" rx="6" fill="#d1fae5"/>
    <text x="108" y="32" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">3D PHYSICS &amp; SPECTRA</text>
    <text x="20" y="62" font-size="17" font-weight="700" fill="#0f172a">Conformer Embedding, MACE Forces &amp; NMR</text>
    <text x="20" y="86" font-size="12.5" fill="#475569">• Alias expansion (Me, Et, OMe, Ph, Boc, CO2Et) + 10-gate 3D audit</text>
    <text x="20" y="106" font-size="12.5" fill="#475569">• ETKDGv3 + 0.1 Å rattle → MACE-OFF23 energies/forces → split_forcefield</text>
    <text x="20" y="126" font-size="12.5" fill="#475569">• Paper P1: HRMS + MACE strain + O(3) ¹³C/¹H NMR rescue (73.3% lit NMR)</text>
    <text x="20" y="148" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#047857">image_to_forcefield.py · ouroboros.ui · yaniguan.github.io/ouroboros-ocsr/lab/</text>
  </g>

  <g transform="translate(744, 476)">
    <rect width="496" height="144" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="20" y="16" width="188" height="24" rx="6" fill="#f1f5f9"/>
    <text x="114" y="32" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">ACTIVE FORCE-FIELD LOOP</text>
    <text x="20" y="60" font-size="17" font-weight="700" fill="#0f172a">3D Bioisostere Blind-Spot Audit (Paper P2)</text>
    <text x="20" y="84" font-size="12.5" fill="#475569">• 112 paired sp³ cages (BCP, BCH, cubane, azaspiro, -SF₅) + torsion scans</text>
    <text x="20" y="104" font-size="12.5" fill="#475569">• Offset-free committee force uncertainty σ_F + conservative K-head replay</text>
    <text x="20" y="125" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">ouroboros.active · check_leakage.py --fail-on-connectivity</text>
  </g>

  <!-- ARROWS -->
  <line x1="270" y1="182" x2="328" y2="182" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="270" y1="356" x2="328" y2="310" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="270" y1="538" x2="328" y2="538" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>

  <line x1="676" y1="186" x2="736" y2="186" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="676" y1="296" x2="736" y2="352" stroke="#0d9488" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="992" y1="454" x2="992" y2="470" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-slate)"/>
</svg>
