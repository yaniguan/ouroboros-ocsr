seed: 2
data:
  synthetic_root: /content/data/full/shards
  synthetic_max_samples: 200000
  real_roots:
  - /content/real/train
  real_fraction: 0.1
  exclude_keys: null
  image_size: 384
  vocab: configs/vocab.json
  num_workers: 8
model:
  encoder:
    type: steerable
    N: 8
    fields:
    - 7
    - 14
    - 29
    - 58
  decoder:
    d_model: 512
    n_layers: 6
    n_heads: 8
    d_ff: 2048
    dropout: 0.1
    max_len: 128
train:
  device: auto
  batch_size: 64
  steps: 40000
  lr: 0.0003
  warmup: 1000
  weight_decay: 0.05
  grad_clip: 1.0
  amp: bf16
  label_smoothing: 0.0
  rotation_aug: true
  log_every: 50
  ckpt_every: 1000
eval:
  batch_size: 256
  sets:
    rendered_test:
      root: /content/data/full/shards
      split: test
      kind: rendered
      max_samples: null
  sweep_angles_step: 15
  sweep_max_samples: 2000
meta:
  run_id: Cplus_n200k_f0.1_s2
  arm: C+
  size: 200000
  real_fraction: 0.1
  seed: 2
  real_fraction_is_placeholder: true
