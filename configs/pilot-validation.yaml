# Explicit synthetic-only protocol; legacy/mixed-data sweep defaults are unchanged.
base: base.yaml
seed: 0
data:
  synthetic_max_samples: 200000
  real_roots: []
  real_fraction: 0.0
train:
  batch_size: 32
  steps: 10000
validation:
  enabled: true
  root: /content/data/full/shards
  split: val
  samples: 1000
  batch_size: 32
  every: 1000
  patience: 5
  min_delta: 0.001
