[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros-ocsr"
version = "0.1.0a1"
description = "Rotation-equivariant OCSR with stereochemistry, pure-PyTorch inference, and 3D physics verification"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Core inference & evaluation dependencies are 100% prebuilt wheels (no gfortran or escnn needed).
dependencies = [
    "torch",
    "rdkit",
    "ase",
    "pyyaml",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
train = ["escnn", "webdataset", "matplotlib"]
mace = ["mace-torch"]
api = ["fastapi", "uvicorn"]
data = ["pyarrow", "webdataset", "matplotlib"]
dev = ["pytest", "ruff", "nbformat", "fastapi", "httpx", "pyarrow", "matplotlib", "webdataset"]
demo = ["jupyterlab>=4,<5", "matplotlib"]
# Hugging Face export/upload (scripts/export_hf_release.py falls back to .bin without safetensors)
hf = ["safetensors", "huggingface_hub"]
full = ["escnn", "mace-torch", "webdataset", "matplotlib", "fastapi", "uvicorn", "pyarrow"]

[tool.setuptools.package-data]
"ouroboros" = ["weights.json"]
"ouroboros.demo" = ["index.html"]
"ouroboros.ui" = ["index.html"]
"lab.configs" = ["*.json"]

[tool.setuptools.packages.find]
include = ["ouroboros*", "lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root first so our scripts/ package wins over the top-level
# `scripts` package that mace-torch installs into site-packages.
pythonpath = ["."]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# archived run evidence and generator-synced Colab notebooks are checked separately in pytest
extend-exclude = ["notebooks", "colab"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# notebook and SMILES catalog generators embed literal source/SMILES lines
"scripts/build_molecule_catalog.py" = ["E501"]
"scripts/make_colab_nbs.py" = ["E501"]
"scripts/make_finetune_v2_nb.py" = ["E501"]
"scripts/make_real_pmc_nb.py" = ["E501"]
