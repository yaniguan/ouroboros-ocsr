[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros-ocsr"
version = "0.1.0a1"
description = "Rotation-equivariant OCSR with stereochemistry, followed by a 3D MACE energy stage"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Exact pins live in requirements.txt; these are the direct dependencies only.
dependencies = [
    "torch",
    "escnn",
    "rdkit",
    "mace-torch",
    "webdataset",
    "pyyaml",
    "numpy",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
demo = ["jupyterlab>=4,<5"]
# Hugging Face export/upload (scripts/export_hf_release.py falls back to .bin without safetensors)
hf = ["safetensors", "huggingface_hub"]

[tool.setuptools.package-data]
"ouroboros" = ["weights.json"]
"ouroboros.demo" = ["index.html"]

[tool.setuptools.packages.find]
include = ["ouroboros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# archived run evidence is kept byte-for-byte, so it is not linted
extend-exclude = ["notebooks", "benchmarks/hpc-20260930"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# notebook generators embed notebook source lines verbatim
"scripts/make_colab_nbs.py" = ["E501"]
