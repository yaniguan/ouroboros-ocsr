seed: 0
data:
  synthetic_root: /content/ouroboros-20260930-clean3/data/full/shards
  synthetic_max_samples: 200000
  real_roots: []
  real_fraction: 0.0
  exclude_keys: null
  image_size: 384
  vocab: configs/vocab.json
  num_workers: 4
model:
  encoder:
    type: baseline
  decoder:
    d_model: 512
    n_layers: 6
    n_heads: 8
    d_ff: 2048
    dropout: 0.1
    max_len: 128
train:
  device: cuda
  batch_size: 32
  steps: 10000
  lr: 0.0003
  warmup: 1000
  weight_decay: 0.05
  grad_clip: 1.0
  amp: bf16
  label_smoothing: 0.0
  rotation_aug: false
  log_every: 50
  ckpt_every: 1000
eval:
  batch_size: 32
  sets:
    rendered_test:
      root: /content/ouroboros-20260930-clean3/data/full/shards
      split: test
      kind: rendered
      max_samples: null
  sweep_angles_step: 15
  sweep_max_samples: 2000
validation:
  enabled: true
  root: /content/ouroboros-20260930-clean3/data/full/shards
  split: val
  samples: 1000
  batch_size: 32
  every: 1000
  patience: 5
  min_delta: 0.001
