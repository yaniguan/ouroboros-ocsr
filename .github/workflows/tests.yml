name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (CPU-only torch, pinned requirements minus CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          grep -viE '^(torch|triton|nvidia-|cuda-)' requirements.txt > /tmp/req-cpu.txt
          pip install -r /tmp/req-cpu.txt
          pip install -e . --no-deps
      - name: pytest (CPU; GPU-only tests skip themselves)
        run: pytest -q
